<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaPulse AI - Live Trading Indicator & Forecast Terminal</title>
    <meta name="description" content="Real-time trading indicator and signal intelligence terminal powered by multi-indicator technical analysis, live market feeds, scenario price projections, and AI-grounded world news catalysts." />
    <meta property="og:title" content="AlphaPulse AI - Live Trading Indicator & Forecast Terminal" />
    <meta property="og:description" content="Real-time trading indicator and signal intelligence terminal powered by multi-indicator technical analysis, live market feeds, scenario price projections, and AI-grounded world news catalysts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js" async></script>
  </head>
  <body class="bg-[#f8fafc] text-slate-800 antialiased selection:bg-emerald-500/20 selection:text-emerald-700">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <style>
          @keyframes ap-pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
          }
          @keyframes ap-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border: 3px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: ap-spin 1s linear infinite;"></div>
          <div style="position: absolute; inset: 6px; border: 3px solid #6366f1; border-bottom-color: transparent; border-radius: 50%; animation: ap-spin 1.5s linear infinite reverse;"></div>
          <div style="position: absolute; inset: 16px; background-color: #10b981; border-radius: 50%; animation: ap-pulse-ring 2s infinite;"></div>
        </div>
        <div style="font-weight: 900; font-size: 20px; letter-spacing: -0.025em; color: #ffffff; text-transform: uppercase;">
          AlphaPulse AI Terminal
        </div>
        <div style="font-size: 13px; color: #94a3b8; font-family: monospace; margin-top: 8px;">
          Initializing live chart algorithms, indicators &amp; market feeds...
        </div>
        <noscript>
          <div style="margin-top: 16px; padding: 10px 16px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 8px; color: #fca5a5; font-size: 13px;">
            ⚠️ JavaScript is required to load AlphaPulse AI Terminal. Please enable JavaScript in your browser.
          </div>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
